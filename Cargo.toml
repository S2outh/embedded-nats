[package]
name = "embedded-nats"
version = "1.0.0"
edition = "2024"
authors = [ "Eliseo Cailloux" ]

[features]
alloc = []
critical-section-mutex = []
defmt = [ "dep:defmt", "embassy-sync/defmt", "embassy-futures/defmt", "embassy-net/defmt", "serde-json-core/defmt" ]

[dependencies]

embassy-sync = { version = "0.8.0" }
embassy-futures = { version = "0.1.2" }
embassy-net = { version = "0.9.1", features = ["tcp", "dhcpv4", "proto-ipv4", "proto-ipv6" ] }
embedded-io-async = "0.7.0"

serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde-json-core = { version = "0.6.0" }
heapless = { version = "0.9.3", features = ["serde"] }

thiserror = { version = "2.0.20", default-features = false }

defmt = { version = "1.1", optional = true }
portable-atomic = "1.15.0"

[dev-dependencies]
embassy-sync = { version = "0.8.0", features = ["std"] }

[profile.release]
debug = 2
